[tool.poetry]
name = "bank-analytics"
version = "0.1.0"
description = "Bank analytics application"
authors = ["Your Name <your.email@example.com>"]
package-mode = false  # Здесь правильно

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.12.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
types-requests = "^2.31.0"
pandas-stubs = "^2.1.0"

[tool.black]
line-length = 119
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "requests.*",
    "dotenv.*",
]
ignore_missing_imports = true
